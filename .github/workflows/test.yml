name: Failure Handling Demo

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log Level'
        required: true
        default: 'warning'
      tags:
        description: 'Test Scenario'
        required: false

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Print Inputs
        run: |
          echo "Log Level: ${{ github.event.inputs.logLevel }}"
          echo "Tags: ${{ github.event.inputs.tags }}"

      - name: Conditional Logging
        run: |
          if [ "${{ github.event.inputs.logLevel }}" = "error" ]; then
            echo "🚨 Error level selected"
          elif [ "${{ github.event.inputs.logLevel }}" = "warning" ]; then
            echo "⚠️ Warning level selected"
          else
            echo "ℹ️ Info level selected"
          fi

      - name: Simulate Failure
        if: ${{ github.event.inputs.tags == 'fail' }}
        run: |
          echo "Simulating failure..."
          exit 1

      - name: Runs Only If Previous Step Failed
        if: failure()
        run: |
          echo "Handling failure gracefully..."

      - name: Runs Only If Success
        if: success()
        run: |
          echo "Workflow completed successfully!"
